services:
  ocr:
    build: .
    container_name: ocr-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
    volumes:
      - marker_cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  marker_cache:
